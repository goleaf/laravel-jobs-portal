name: Dusk Tests
on: [push, pull_request]
jobs:
  dusk-tests:
    runs-on: windows-2022  # Using Windows Server 2022 (closest to Windows 11 for CI)
    env:
      APP_URL: "http://127.0.0.1:8000"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: log
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP with Memory Limit
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          ini-values: memory_limit=4G, max_execution_time=600
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Prepare The Environment
        run: |
          copy .env.example .env
          echo DB_CONNECTION=sqlite >> .env
          echo DB_DATABASE=:memory: >> .env
        
      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
        
      - name: Install NPM Dependencies
        run: npm ci --silent
        
      - name: Build Assets
        run: npm run build
        
      - name: Generate Application Key
        run: php -d memory_limit=4G artisan key:generate
        
      - name: Run Migrations
        run: php -d memory_limit=4G artisan migrate --force
        
      - name: Install ChromeDriver
        run: php artisan dusk:chrome-driver --detect
        
      - name: Start ChromeDriver
        run: |
          Start-Process -FilePath "vendor\laravel\dusk\bin\chromedriver-win.exe" -ArgumentList "--port=9515" -WindowStyle Hidden
          Start-Sleep -Seconds 3
        shell: powershell
        
      - name: Start Laravel Server
        run: |
          Start-Process -FilePath "php" -ArgumentList "-d","memory_limit=4G","artisan","serve","--no-reload" -WindowStyle Hidden
          Start-Sleep -Seconds 5
        shell: powershell
        
      - name: Test Website Accessibility
        run: |
          $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000/" -UseBasicParsing
          if ($response.StatusCode -eq 200) {
            Write-Output "✅ Website is accessible"
          } else {
            Write-Output "❌ Website is not accessible"
            exit 1
          }
        shell: powershell
          
      - name: Run Dusk Tests
        run: php artisan dusk --env=testing
        
      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots
          path: tests/Browser/screenshots
          
      - name: Upload Console Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-console-logs
          path: tests/Browser/console 