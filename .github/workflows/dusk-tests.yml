name: Dusk Tests
on: [push, pull_request]
jobs:
  dusk-tests:
    runs-on: ubuntu-latest
    env:
      APP_URL: "http://127.0.0.1:8000"
      DB_USERNAME: root
      DB_PASSWORD: root
      MAIL_MAILER: log
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP with Memory Limit
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          ini-values: memory_limit=4G, max_execution_time=600
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Prepare The Environment
        run: cp .env.example .env
        
      - name: Create Database
        run: |
          sudo systemctl start mysql
          mysql --user="root" --password="root" -e "CREATE DATABASE \`jobportal-testing\` character set UTF8mb4 collate utf8mb4_bin;"
          
      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader --no-dev
        
      - name: Install NPM Dependencies
        run: npm ci --silent
        
      - name: Build Assets
        run: npm run build
        
      - name: Generate Application Key
        run: php -d memory_limit=4G artisan key:generate
        
      - name: Run Migrations
        run: php -d memory_limit=4G artisan migrate --force
        
      - name: Start Laravel Server
        run: php -d memory_limit=4G artisan serve > /dev/null 2>&1 &
        
      - name: Wait for Server
        run: sleep 5
        
      - name: Test Website Accessibility
        run: |
          curl -f http://127.0.0.1:8000/ || exit 1
          echo "✅ Website is accessible"
          
      - name: Test Login Page
        run: |
          curl -f http://127.0.0.1:8000/login || exit 1
          echo "✅ Login page is accessible"
          
      - name: Test Register Page
        run: |
          curl -f http://127.0.0.1:8000/register || exit 1
          echo "✅ Register page is accessible"
          
      - name: Run Simple Functionality Test
        run: php simple-dusk-test.php 