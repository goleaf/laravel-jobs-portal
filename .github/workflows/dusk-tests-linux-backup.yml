name: Dusk Tests (Linux Backup)
on:
  workflow_dispatch:  # Manual trigger only
jobs:
  dusk-tests-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_ENV: testing
      APP_URL: "http://127.0.0.1:8000"
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      MAIL_MAILER: log
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          ini-values: memory_limit=2G, max_execution_time=300
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Create Environment File
        run: |
          cp .env.example .env
          echo "APP_ENV=testing" >> .env
          echo "DB_CONNECTION=sqlite" >> .env
          echo "DB_DATABASE=:memory:" >> .env
        
      - name: Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader
        
      - name: Install NPM Dependencies
        run: npm ci
        
      - name: Build Assets
        run: npm run build
        
      - name: Generate Application Key
        run: php artisan key:generate --force
        
      - name: Run Migrations
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
        
      - name: Install & Start ChromeDriver
        run: |
          php artisan dusk:chrome-driver --detect
          ./vendor/laravel/dusk/bin/chromedriver-linux --port=9515 &
          sleep 3
        
      - name: Start Laravel Server
        run: |
          php artisan serve --no-reload &
          sleep 5
        
      - name: Verify Services
        run: |
          # Test website accessibility
          response=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/)
          if [ "$response" -eq 200 ]; then
            echo "✅ Website is accessible (Status: $response)"
          else
            echo "❌ Website returned status: $response"
            exit 1
          fi
          
      - name: Run Dusk Tests
        run: php artisan dusk --env=testing
        
      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-screenshots-linux-${{ github.run_number }}
          path: tests/Browser/screenshots
          if-no-files-found: ignore
          
      - name: Upload Console Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-console-logs-linux-${{ github.run_number }}
          path: tests/Browser/console
          if-no-files-found: ignore 